<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Cinder">
  <title>Cinder</title>

  <!-- Single source of truth for the Cinder brand mark — ONE master,
       every surface: the app iconset (iconset, Wails appicon, Windows
       .ico), the browser favicons, the VS Code marketplace + activity-bar
       icons, the JetBrains tool-window icon, the docs sidebar mark
       (build-docs.mjs inlines this file), the README banners, and the app
       UI's BrandMark component. Change this file, run
       scripts/generate-icons.mjs, rebuild the docs — every surface shows
       the new mark. The CI sync gate (check mode) fails on any stale
       derivative, so a rebrand can never ship half-applied.

       Construction (ADR-0050 decision ③, "inverse seal"): a SOLID warm-ink
       field #34322D with the letterform knocked out in paper #F7F4EE. There
       is NO hairline frame — the solid field is itself the mark's edge. This
       replaced ADR-0037's "cream card + 9-unit hairline frame": the inverse
       seal carries the highest contrast, reads first in a store list and at
       small sizes, and is the closest thing to Manus' monochrome minimalism.
       The two brand colours live ONLY here and in the glyph — the signature
       accent (ember) never enters the mark, it lives in the UI tokens.

       Two colours, one place: the field IS the brand ink token and the
       glyph IS the brand paper token. brandTokens.test.ts reads both out of
       this file and binds the app's palette to them, so re-colouring the
       master moves the whole product — and the mark can never drift from
       the UI again.

       Letterform: the C from IBM Plex Sans Bold (© IBM Corp., SIL OFL
       1.1), outlined, scaled to a 320-unit cap height. Centred on visual
       mass, not on the bounding box: the C's aperture opens to the right,
       so the ink sits 9 units right of dead centre. The rule is half the
       gap between the bounding box and the ink centroid — the same rule
       the R it replaced sat under (6 units). Typeface proportions are
       already corrected by a type designer; the brand owns the field,
       colour and application.
       Process: outputs/icon-redesign-v4 (the R), icon-redesign-v5 (the C),
       ADR-0050 (the inverse seal — same C, field and glyph swap roles). -->

  <rect width="512" height="512" fill="#34322D"/>
  <g transform="translate(21.06 13.06) scale(0.941176)">
