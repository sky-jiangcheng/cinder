name: Build and Release (Wails)

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'trae/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, per job. Only three jobs actually write to this repository:
# create-release (publishes the Release), fill-sha256 (commits the digests back
# to master) and nothing else. A workflow-level `contents: write` used to hand
# the write token to every job, including the build matrix, which runs
# `go install ...@v2.13.0` and `npm install sharp` — third-party install
# scripts executing in a job that could push to master. Those jobs need to
# read the repo and upload artifacts, nothing more.
permissions:
  contents: read

jobs:
  # The release must not ship a commit whose CI was red.
  #
  # This gate exists because the release workflow had no dependency on CI at
  # all: it triggered on the tag push and published whatever it built. v2.14.0
  # proved the hole is real — CI FAILED on the tagged commit and the release
  # workflow still published a formal version. The failure was caught later
  # (commit 2c2b8f1 fixed a checkout SHA and a test that hardcoded
  # darwin/arm64), but by then the bad build was already out.
  #
  # The gate polls rather than samples: the tagged commit's CI run starts when
  # the branch push lands, which can be moments before the tag lands, so a
  # single sample would report "no CI run yet" and fail the release for the
  # wrong reason.
  ci-gate:
    name: Require a green CI run on the release commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve the release commit
        id: resolve
        env:
          TAG: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${REF#refs/tags/}" != "$REF" ]; then
            # An ANNOTATED tag's object SHA is the tag object, not the commit.
            # The ^{} pattern dereferences it to the commit the tag points at.
            SHA=$(git ls-remote "https://github.com/${REPO}.git" "refs/tags/${TAG}^{}" | awk 'NR==1{print $1}')
            if [ -z "$SHA" ]; then
              SHA=$(git ls-remote "https://github.com/${REPO}.git" "refs/tags/${TAG}" | awk 'NR==1{print $1}')
            fi
          else
            SHA="${GITHUB_SHA}"
          fi
          if [ -z "$SHA" ]; then
            echo "::error::could not resolve the release commit"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "release commit: $SHA"

      - name: Require CI to be green on that commit
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.resolve.outputs.sha }}
          CI_WAIT_SECONDS: 1800
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + CI_WAIT_SECONDS ))
          while :; do
            runs=$(gh api "repos/${REPO}/actions/runs?head_sha=${SHA}&per_page=100" \
                   --jq '.workflow_runs[] | select(.name == "CI") | "\(.status) \(.conclusion)"' || true)
            if [ -n "$runs" ] && echo "$runs" | grep -q '^completed failure$'; then
              echo "::error::CI FAILED on ${SHA} — refusing to publish a release from a red build"
              echo "$runs"
              gh api "repos/${REPO}/actions/runs?head_sha=${SHA}&per_page=100" \
                 --jq '.workflow_runs[] | select(.name == "CI") | .html_url' || true
              exit 1
            fi
            if [ -n "$runs" ] && echo "$runs" | grep -q '^completed success$'; then
              echo "CI green on ${SHA}"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::no successful CI run on ${SHA} after ${CI_WAIT_SECONDS}s — refusing to publish"
              [ -n "$runs" ] && echo "$runs"
              exit 1
            fi
            echo "waiting for CI on ${SHA} (runs seen: ${runs:-none})..."
            sleep 20
          done

  build:
    name: ${{ matrix.target }}
    needs: ci-gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - target: darwin-amd64
            runner: macos-latest
            goos: darwin
            goarch: amd64
          - target: darwin-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
          - target: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.11'

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # Apple signing and notarisation credentials.
      #
      # This step exists because the secrets have to REACH the build. The
      # previous version of this workflow had a signing block that read
      # $APPLE_CERTIFICATE — and nothing ever set it, because the build job
      # had no env: at all. The block looked like signing worked and was
      # dead code: every release shipped unsigned, and nobody found out until
      # a user reported the Gatekeeper dialog.
      #
      # The App Store Connect API key is preferred over an Apple ID password:
      # no password ends up in the workflow log, and there is no two-factor
      # prompt to answer in the middle of a release. The .p8 key file has to
      # exist on disk for notarytool to read it, so it is written out here.
      - name: Configure Apple signing when a certificate is available
        if: runner.os == 'macOS'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "${CERT}" ]; then
            echo "::notice::No Apple certificate configured — the .dmg will be UNSIGNED."
            echo "::notice::Users will get the 'Apple cannot verify' dialog. See docs/signing.md."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=${CERT}"
            echo "APPLE_CERTIFICATE_PASSWORD=${CERT_PASSWORD}"
            echo "APPLE_SIGNING_IDENTITY=${SIGNING_IDENTITY}"
            echo "APPLE_TEAM_ID=${TEAM_ID}"
          } >> "$GITHUB_ENV"
          if [ -n "${APPLE_ID_SECRET}" ]; then
            echo "APPLE_ID=${APPLE_ID_SECRET}" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=${APPLE_PASSWORD_SECRET}" >> "$GITHUB_ENV"
          fi
          if [ -n "${API_KEY}" ] && [ -n "${API_ISSUER}" ] && [ -n "${API_KEY_P8}" ]; then
            # The .p8 is a file, not a value: notarytool reads it from disk.
            printf '%s' "${API_KEY_P8}" | base64 --decode > "$RUNNER_TEMP/AuthKey_${API_KEY}.p8"
            chmod 600 "$RUNNER_TEMP/AuthKey_${API_KEY}.p8"
            echo "APPLE_API_KEY=${API_KEY}" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=${API_ISSUER}" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey_${API_KEY}.p8" >> "$GITHUB_ENV"
          fi
          echo "Apple signing is ON for this run."

      # The credentials are checked BEFORE the build rather than after it.
      #
      # A half-configured set of notarisation credentials fails twenty
      # minutes into a macOS build, inside notarytool, and reads like a
      # broken toolchain. Checking first turns that into a one-line answer,
      # and it is the only way to tell "signed and notarised" apart from
      # "signed but the notarisation silently did not happen".
      - name: Verify the notarisation credentials are complete
        if: runner.os == 'macOS'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CERT}" ]; then
            echo "No certificate configured — the .dmg will be unsigned. Nothing to check."
            exit 0
          fi
          missing=""
          [ -n "${CERT_PASSWORD}" ] || missing="${missing} APPLE_CERTIFICATE_PASSWORD"
          [ -n "${SIGNING_IDENTITY}" ] || missing="${missing} APPLE_SIGNING_IDENTITY"
          if [ -n "${missing}" ]; then
            echo "::error::the signing credentials are incomplete — missing:${missing}"
            exit 1
          fi
          if [ -n "${API_KEY}" ] || [ -n "${API_ISSUER}" ] || [ -n "${API_KEY_P8}" ]; then
            missing=""
            [ -n "${API_KEY}" ] || missing="${missing} APPLE_API_KEY"
            [ -n "${API_ISSUER}" ] || missing="${missing} APPLE_API_ISSUER"
            [ -n "${API_KEY_P8}" ] || missing="${missing} APPLE_API_KEY_P8"
            if [ -n "${missing}" ]; then
              echo "::error::the App Store Connect key is half configured — missing:${missing}"
              exit 1
            fi
            echo "Notarisation credentials: App Store Connect API key."
          elif [ -n "${APPLE_ID_SECRET}" ] || [ -n "${APPLE_PASSWORD_SECRET}" ] || [ -n "${TEAM_ID}" ]; then
            missing=""
            [ -n "${APPLE_ID_SECRET}" ] || missing="${missing} APPLE_ID"
            [ -n "${APPLE_PASSWORD_SECRET}" ] || missing="${missing} APPLE_PASSWORD"
            [ -n "${TEAM_ID}" ] || missing="${missing} APPLE_TEAM_ID"
            if [ -n "${missing}" ]; then
              echo "::error::the Apple ID credentials are half configured — missing:${missing}"
              exit 1
            fi
            echo "Notarisation credentials: Apple ID."
          else
            echo "::error::a certificate is configured but there are no notarisation credentials."
            echo "::error::Set either APPLE_API_KEY + APPLE_API_ISSUER + APPLE_API_KEY_P8,"
            echo "::error::or APPLE_ID + APPLE_PASSWORD + APPLE_TEAM_ID."
            echo "::error::See docs/signing.md."
            exit 1
          fi

      - name: Generate app icons from SVG
        shell: bash
        run: |
          if [ -f "build/icon.svg" ]; then
            # Initialize a temp package.json in root so npm install works
            if [ ! -f "package.json" ]; then
              node -e "require('fs').writeFileSync('package.json', JSON.stringify({name:'cinder-build',version:'0.0.0',private:true},null,2))"
            fi
            npm install --no-save sharp 2>&1 || true
            if node scripts/generate-icons.mjs 2>&1; then
              echo "Icons generated successfully"
              ls -la build/icons/ || true
              ls -la build/appicon.png || true
            else
              echo "Icon generation failed, continuing without custom icons"
            fi
          fi

      - name: Build Frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Build Wails app
        shell: bash
        run: |
          # Generate macOS .icns from PNG icons before build
          if [ "${{ runner.os }}" = "macOS" ] && [ -d "build/icons" ]; then
            mkdir -p build/icons/icon.iconset
            cp build/icons/icon-512.png build/icons/icon.iconset/icon_512x512.png
            cp build/icons/icon-256.png build/icons/icon.iconset/icon_256x256.png
            cp build/icons/icon-128.png build/icons/icon.iconset/icon_128x128.png
            cp build/icons/icon-64.png build/icons/icon.iconset/icon_32x32@2x.png
            cp build/icons/icon-32.png build/icons/icon.iconset/icon_32x32.png
            cp build/icons/icon-16.png build/icons/icon.iconset/icon_16x16.png
            iconutil -c icns build/icons/icon.iconset -o build/icons/icon.icns
            rm -rf build/icons/icon.iconset
            echo "Generated icon.icns"
          fi

          # Read version from wails.json (SSOT) and inject into Go binary via ldflags.
          # scripts/bump-version.sh keeps wails.json, package.json, docs in sync; this
          # step guarantees the binary itself reports the same version at runtime.
          APP_VERSION=$(grep -oE '"productVersion"[[:space:]]*:[[:space:]]*"[^"]+"' wails.json | head -1 | sed -E 's/.*"([^"]+)"$/\1/')
          echo "Building version: $APP_VERSION"
          LDFLAGS="-X repotory/internal/version.Version=$APP_VERSION"

          export PATH=$PATH:$(go env GOPATH)/bin
          if [ "${{ runner.os }}" = "Linux" ]; then
            go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
            wails build -platform ${{ matrix.goos }}/${{ matrix.goarch }} -clean -tags webkit2_41 -ldflags "$LDFLAGS"
          elif [ "${{ runner.os }}" = "macOS" ] && [ "${{ matrix.goarch }}" = "amd64" ]; then
            GOOS=darwin GOARCH=amd64 go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
            cp $(go env GOPATH)/bin/darwin_amd64/wails $(go env GOPATH)/bin/wails-amd64
            arch -x86_64 $(go env GOPATH)/bin/wails-amd64 build -platform ${{ matrix.goos }}/${{ matrix.goarch }} -clean -ldflags "$LDFLAGS"
          else
            go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
            wails build -platform ${{ matrix.goos }}/${{ matrix.goarch }} -clean -ldflags "$LDFLAGS"
          fi

      # cinder-mcp is the AI execution interface (MCP stdio server) and ships
      # as its own release asset so `claude mcp add repotory -- ...` works without
      # building from source. Pure Go / zero CGO, so the matrix target builds
      # natively. Version is injected from wails.json (SSOT), same as the app.
      - name: Build MCP server
        shell: bash
        run: |
          set -e
          APP_VERSION=$(grep -oE '"productVersion"[[:space:]]*:[[:space:]]*"[^"]+"' wails.json | head -1 | sed -E 's/.*"([^"]+)"$/\1/')
          echo "Building cinder-mcp version: $APP_VERSION"
          LDFLAGS="-X repotory/internal/version.Version=$APP_VERSION"
          mkdir -p build/mcp
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags "$LDFLAGS" -o build/mcp/cinder-mcp ./cmd/mcp/
          # `go build -o name` uses the name verbatim, so add the Windows suffix
          # ourselves — the release archive and both manifests expect cinder-mcp.exe.
          if [ "${{ runner.os }}" = "Windows" ] && [ -f build/mcp/cinder-mcp ]; then
            mv build/mcp/cinder-mcp build/mcp/cinder-mcp.exe
          fi
          # Compatibility alias (ADR-0049 补注): every existing MCP client
          # config points at the old path, so the archive carries both names.
          # A symlink is free on Unix; Windows gets the alias from
          # install.ps1 and the Scoop shim rather than a duplicate 11 MB exe.
          if [ "${{ runner.os }}" != "Windows" ]; then
            ln -sf cinder-mcp build/mcp/repotory-mcp
          fi
          ls -lh build/mcp/

      # The JetBrains plugin can start this server with one click, so end users
      # need it as a release asset (ADR-0027 usability revision). The bundle
      # ships the SPA next to the binary: the plugin passes
      # `--web-dist <binary dir>/web` automatically, which is what makes
      # "Open in Cinder" deep links work out of the box. The server build of
      # the web assets has base "/" — the desktop `web/dist` (base "./") is not
      # interchangeable, hence the separate build:server invocation.
      - name: Build headless server bundle
        shell: bash
        run: |
          set -e
          APP_VERSION=$(grep -oE '"productVersion"[[:space:]]*:[[:space:]]*"[^"]+"' wails.json | head -1 | sed -E 's/.*"([^"]+)"$/\1/')
          echo "Building cinder-server version: $APP_VERSION"
          LDFLAGS="-X repotory/internal/version.Version=$APP_VERSION"
          (cd web && npm run build:server)
          mkdir -p build/server
          rm -rf build/server/web
          cp -R web/dist-server build/server/web
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags "$LDFLAGS" -o build/server/cinder-server ./cmd/server
          if [ "${{ runner.os }}" = "Windows" ] && [ -f build/server/cinder-server ]; then
            mv build/server/cinder-server build/server/cinder-server.exe
          fi
          # Same compatibility alias as the MCP archive above.
          if [ "${{ runner.os }}" != "Windows" ]; then
            ln -sf cinder-server build/server/repotory-server
          fi
          ls -lh build/server/

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          set -e
          VER=$(grep -oE '"productVersion"[[:space:]]*:[[:space:]]*"[^"]+"' wails.json | head -1 | sed -E 's/.*"([^"]+)"$/\1/')
          mkdir -p build/bin/release
          # Asset names carry the brand AND the version: a download sitting in
          # ~/Downloads has to say which build it is. The tarball keeps the old
          # binary name as a symlink so an existing PATH entry keeps working.
          ln -sf cinder build/bin/repotory
          tar -czf "build/bin/release/Cinder-$VER-linux-amd64.tar.gz" -C build/bin cinder repotory
          tar -czf "build/bin/release/cinder-mcp-$VER-linux-amd64.tar.gz" -C build/mcp cinder-mcp repotory-mcp
          tar -czf "build/bin/release/cinder-server-$VER-linux-amd64.tar.gz" -C build/server cinder-server repotory-server web
          echo "RELEASE_DIR=build/bin/release" >> $GITHUB_ENV

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          set -e
          mkdir -p release

          # Wails produces .app bundle in build/bin/
          #
          # A missing .app is a BUILD FAILURE, not something to skip past. The
          # old code guarded the whole packaging block with `if [ -n "$APP" ]`,
          # so a Wails run that produced no bundle silently published a release
          # with the mcp/server archives but no app: the Homebrew cask and the
          # in-app updater both point at the .dmg, and neither 404s until a
          # user tries to install. The upload step's `if-no-files-found: error`
          # does not catch it — the directory is not empty, the dmg is just
          # not in it.
          APP=$(ls -d build/bin/*.app 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "::error::Wails produced no .app bundle in build/bin/ — refusing to publish a release without the macOS download"
            echo "build/bin contents:"
            ls -la build/bin/ || true
            exit 1
          fi
          APP_NAME=$(basename "$APP")
          APP_PATH="$APP"

          # create-dmg is a dependency of the signing script: the .dmg is
          # built AROUND the notarised app, so signing and packaging are one
          # operation, not two.
          #
          # The three ways of getting it are chained with `||` and `&&`
          # together, which is where the old one-liner went wrong: `||` and
          # `&&` have the SAME precedence and associate left to right, so
          # `a || b || c && d` reads as `((a || b || c) && d)`. When `brew`
          # succeeded, the `cd create-dmg-1.0.0` that belongs to the TARBALL
          # fallback still ran, and the step died on a directory that was
          # never extracted — with the error pointing at a path that has
          # nothing to do with the actual problem.
          #
          # Written out, the intent is obvious: use create-dmg if it is
          # there, otherwise install it, and fail loudly if it still is not
          # there.
          if ! command -v create-dmg >/dev/null 2>&1; then
            if ! brew install create-dmg; then
              curl -sL https://github.com/create-dmg/create-dmg/archive/refs/tags/v1.0.0.tar.gz | tar -xz
              cd create-dmg-1.0.0
              sudo make install
              cd ..
            fi
          fi
          if ! command -v create-dmg >/dev/null 2>&1; then
            echo "::error::create-dmg is still not on PATH — the .dmg cannot be built."
            exit 1
          fi

          VER=$(grep -oE '"productVersion"[[:space:]]*:[[:space:]]*"[^"]+"' wails.json | head -1 | sed -E 's/.*"([^"]+)"$/\1/')
          DMG="release/Cinder-$VER-${{ matrix.target }}.dmg"

          # One script for the whole chain: import the certificate, sign the
          # app, notarise it, staple the ticket, build the .dmg around it,
          # notarise the .dmg, staple that, and ask Gatekeeper whether the
          # result passes.
          #
          # The order matters and the script is where it is enforced: an app
          # has to carry its own notarisation ticket before it is wrapped in a
          # .dmg, and the .dmg has to carry one too, because the .dmg is what
          # the browser downloads and what Gatekeeper looks at first.
          #
          # Every step in the script fails the step. A release that quietly
          # skips notarisation still installs, so the failure would only show
          # up as "Apple cannot verify" in front of a user.
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "Signing and notarising with the Developer ID certificate."
            ./scripts/sign-macos.sh "$APP_PATH" "$DMG"
          else
            echo "::warning::No APPLE_CERTIFICATE configured — building an UNSIGNED .dmg."
            echo "::warning::Users will get the 'Apple cannot verify' dialog. See docs/signing.md."
            STAGING=$(mktemp -d)
            cp -R "$APP" "$STAGING/"
            ln -s /Applications "$STAGING/Applications"
            mkdir -p "$STAGING/.background"
            sips -s format png "build/dmg-background.svg" --out "$STAGING/.background/background.png"
            create-dmg \
              --volname "Cinder Desktop" \
              --window-size 600 400 \
              --icon-size 80 \
              --icon "$APP_NAME" 100 280 \
              --hide-extension "$APP_NAME" \
              --app-drop-link 400 280 \
              --background "$STAGING/.background/background.png" \
              --format UDZO \
              "$DMG" \
              "$STAGING/"
            rm -rf "$STAGING"
          fi

          # Belt and braces: the .dmg is the artifact every installer points
          # at, so its absence must fail the job even if create-dmg exited 0.
          if [ ! -f "$DMG" ]; then
            echo "::error::$DMG was not produced"
            ls -la release/ || true
            exit 1
          fi

          # MCP server: separate archive, same release, no codesign/notary impact
          # on the .dmg above.
          tar -czf "release/cinder-mcp-$VER-${{ matrix.target }}.tar.gz" -C build/mcp cinder-mcp repotory-mcp
          tar -czf "release/cinder-server-$VER-${{ matrix.target }}.tar.gz" -C build/server cinder-server repotory-server web

          echo "RELEASE_DIR=release" >> $GITHUB_ENV

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          mkdir -p release
          # Same rule as the macOS job: a missing binary is a build failure.
          # Skipping it publishes a release whose Windows download 404s, and
          # the artifact upload's if-no-files-found:error does not catch it
          # because the directory is not empty.
                    VER=$(grep -oE '"productVersion"[[:space:]]*:[[:space:]]*"[^"]+"' wails.json | head -1 | sed -E 's/.*"([^"]+)"$/\1/')
          for f in build/bin/cinder.exe build/mcp/cinder-mcp.exe build/server/cinder-server.exe; do
            if [ ! -f "$f" ]; then
              echo "::error::$f was not produced — refusing to publish a release with a missing Windows artifact"
              ls -la build/bin build/mcp build/server 2>/dev/null || true
              exit 1
            fi
          done
          powershell Compress-Archive -Path "build/bin/cinder.exe" -DestinationPath "release/Cinder-$VER-windows-amd64.zip"
          powershell Compress-Archive -Path "build/mcp/cinder-mcp.exe" -DestinationPath "release/cinder-mcp-$VER-windows-amd64.zip"
          powershell Compress-Archive -Path "build/server/cinder-server.exe","build/server/web" -DestinationPath "release/cinder-server-$VER-windows-amd64.zip"
          echo "RELEASE_DIR=release" >> "$GITHUB_ENV"

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bundle-${{ matrix.target }}
          path: ${{ env.RELEASE_DIR }}/
          if-no-files-found: error

  vscode-extension:
    name: Package VS Code extension
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: ide/vscode/package-lock.json

      - name: Package VSIX
        run: |
          set -euo pipefail
          VER="${GITHUB_REF#refs/tags/v}"
          cd ide/vscode
          npm ci
          npm run compile
          npx @vscode/vsce package --no-dependencies -o "../../cinder-vscode-${VER}.vsix"

      - name: Upload vsix artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vsix-extension
          path: cinder-vscode-*.vsix
          if-no-files-found: error

  # The JetBrains plugin was never built by any release job before this: the
  # plugin shipped only if somebody ran `gradle buildPlugin` by hand, so a tag
  # produced a VSIX but no .zip for the IDE plugin. Mirrors the
  # vscode-extension job above; `verifyPlugin` stays a local check (see
  # .github/workflows/ci.yml).
  jetbrains-plugin:
    name: Package JetBrains plugin
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.10.2'

      - name: Build plugin (gradle buildPlugin)
        working-directory: ide/jetbrains
        run: gradle buildPlugin

      # Gradle names the distribution after the plugin's display name and
      # version ("Cinder Memory-2.33.0.zip"). Release assets follow one shape
      # for every artifact, so the zip is renamed rather than the build being
      # taught a second naming rule.
      - name: Rename the plugin zip to the release convention
        run: |
          set -euo pipefail
          VER="${GITHUB_REF#refs/tags/v}"
          shopt -s nullglob
          for f in ide/jetbrains/build/distributions/*.zip; do
            mv "$f" "cinder-jetbrains-${VER}.zip"
          done
          ls -lh cinder-jetbrains-*.zip

      - name: Upload plugin artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jetbrains-plugin
          path: cinder-jetbrains-*.zip
          if-no-files-found: error

  # The WorkBuddy skill package. It is platform-independent (markdown plus one
  # python script), so unlike the binaries it is packaged ONCE per release
  # rather than per matrix target. The .skill file is a zip whose single
  # top-level directory is the skill name — the loader rejects a package
  # whose root does not match, which is why the archive is built from the
  # parent of skill/repotory rather than from skill/ itself.
  skill-package:
    name: Package WorkBuddy skill
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Package skill
        run: |
          set -euo pipefail
          VER="${GITHUB_REF#refs/tags/v}"
          # The query script is invoked by absolute path from SKILL.md, so it
          # must stay executable inside the archive.
          chmod +x skill/repotory/scripts/repotory-query.py
          cd skill
          zip -r "../cinder-${VER}.skill" repotory
          cd ..
          # Listing is a guard against shipping an empty archive, and it runs
          # from the repo root — where the zip actually landed. The `../` that
          # used to be here pointed one level above the checkout, so the guard
          # failed the job after the archive had been built correctly.
          unzip -l "cinder-${VER}.skill"

      - name: Upload skill artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: skill-package
          path: cinder-*.skill
          if-no-files-found: error

  # The human-written half of the release notes.
  #
  # GitHub's own generated notes are a list of commit subjects plus a compare
  # link: every line says what a commit was CALLED, not what changed for the
  # user — and this project's commits are small, incremental and heavily
  # internal ("fix(test): 比对要归一化", "chore(packaging): fill sha256"). A
  # reader landing on the release page learned nothing from them.
  #
  # The CHANGELOG already carries the opposite kind of text: every entry opens
  # with a bold headline written for a reader ("IDE 面板重画：按钮不再被裁切…")
  # and then continues into the reasoning, the decisions and the cost. That
  # headline IS the release note; the rest is the design record, and the design
  # record belongs in the repository. So this job reduces one version's section
  # to its headlines and hands the result to create-release, which prepends it
  # to GitHub's generated notes. Nothing is lost, the page just stops opening
  # with a diffstat.
  #
  # A separate job rather than a step inside create-release, for one concrete
  # reason: that job's workspace root holds the release artifacts, and its
  # SHA256SUMS step hashes EVERY file in that root (install.sh verifies that
  # list against what the user actually downloaded) — a stray CHANGELOG.md
  # sitting there would break every install.
  release-notes:
    name: Build release notes
    needs: ci-gate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'

      - name: Reduce the changelog to release headlines
        run: |
          set -euo pipefail
          VER="${GITHUB_REF#refs/tags/v}"
          # The script refuses a section that is missing, empty, or has an
          # entry without a bold headline. CI runs the same check on every
          # push, so reaching this point means the changelog was already
          # proven publishable — but a tag must never ship an empty body.
          node scripts/release-notes.mjs --version "$VER" --out release-notes.md
          cat release-notes.md

      - name: Upload release notes artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [build, vscode-extension, jetbrains-plugin, skill-package, release-notes]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: '{bundle-*,vsix-extension,jetbrains-plugin,skill-package}'
          merge-multiple: true

      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-notes
          # Into a subdirectory on purpose: the SHA256SUMS step below hashes
          # every FILE in the workspace root, and that list is what the
          # installers verify against. The notes are not a downloadable
          # artifact and must not end up in it.
          path: notes

      - name: List release files
        run: ls -lh

      - name: Assert every expected asset is present
        run: |
          set -euo pipefail
          VER="${GITHUB_REF#refs/tags/v}"
          # The release is the only thing the outside world can reach: the
          # Homebrew cask, the Scoop manifest, the in-app updater and the IDE
          # marketplaces all point at these files by name. A missing asset is
          # a 404 for a user, and softprops/action-gh-release's glob list
          # matches whatever happens to be there — a missing file simply does
          # not match, and the release is published anyway.
          #
          # This is the last line of defence for every platform at once; the
          # per-platform packaging jobs fail on their own missing binaries
          # earlier. A release that cannot be installed must not be tagged as
          # published.
          missing=()
          # Every asset name carries the brand and the version, so this list
          # is also the contract the manifests and the install scripts address.
          for t in linux-amd64 darwin-amd64 darwin-arm64 windows-amd64; do
            # The app bundle and the companion archives do NOT share an
            # extension: the macOS app is a .dmg while its mcp/server archives
            # are tarballs; only Windows uses .zip for all three.
            case "$t" in
              linux-*)   app="Cinder-${VER}-${t}.tar.gz"; arch="tar.gz" ;;
              darwin-*)  app="Cinder-${VER}-${t}.dmg";    arch="tar.gz" ;;
              windows-*) app="Cinder-${VER}-${t}.zip";    arch="zip" ;;
            esac
            [ -f "$app" ] || missing+=("$app")
            for f in "cinder-mcp-${VER}-${t}.${arch}" "cinder-server-${VER}-${t}.${arch}"; do
              [ -f "$f" ] || missing+=("$f")
            done
          done
          for f in "cinder-vscode-${VER}.vsix" "cinder-jetbrains-${VER}.zip" "cinder-${VER}.skill"; do
            [ -f "$f" ] || missing+=("$f")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::release assets are missing: ${missing[*]}"
            echo "refusing to publish a release that cannot be installed"
            ls -lh . || true
            exit 1
          fi
          echo "all expected assets present for ${VER}"

      - name: Assert the release notes are there and non-empty
        run: |
          set -euo pipefail
          # softprops/action-gh-release reads body_path with readFileSync and,
          # if that fails, only WARNS and falls back to an empty body. A
          # silent fallback would publish a release whose body is nothing but
          # GitHub's commit list — the exact thing this job exists to prevent.
          if [ ! -s notes/release-notes.md ]; then
            echo "::error::notes/release-notes.md is missing or empty"
            exit 1
          fi
          head -3 notes/release-notes.md

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          # This job has no checkout step, so everything at the workspace root
          # is a downloaded release artifact. Exclude SHA256SUMS itself from
          # its own list. scripts/install.sh and install.ps1 verify every
          # download against this file (and skip gracefully when it is
          # absent, so pre-checksum releases keep installing).
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            *.dmg
            *.AppImage
            *.deb
            *.msi
            *.vsix
            *.zip
            *.tar.gz
            *.skill
            SHA256SUMS
          # The human-written headlines from the CHANGELOG. The action
          # PREPENDS this to GitHub's own generated notes (the commit list and
          # the compare link), so the page opens with what changed for the
          # reader and keeps the machine-made part below it.
          body_path: notes/release-notes.md
          generate_release_notes: true

  # Push the manifests to the external tap and bucket.
  #
  # This job exists because packaging/README.md claimed the tap and the bucket
  # "are copied here on every release" — and nothing did it. The manifests were
  # updated in THIS repository (fill-sha256 commits them back to master) and
  # then went nowhere: the tap still served the pre-rename RepoNest v1.8.0
  # manifests while the product shipped v2.14.0, so `brew install --cask
  # repotory` did not exist at all.
  #
  # scripts/sync-packaging.sh is the missing half. It runs after fill-sha256,
  # which is what puts the real digests in the manifests — syncing before the
  # digests are filled would publish placeholders, and Homebrew and Scoop both
  # hard-fail on a digest mismatch.
  sync-packaging:
    name: Sync manifests to the tap and bucket
    needs: fill-sha256
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    env:
      # A PAT with write access to the tap and the bucket. The workflow token
      # of THIS repository cannot write to them, and cannot update
      # .github/workflows/* at all (that needs the `workflow` scope). Kept at
      # job level so the steps' `if` can see whether it is set.
      PACKAGING_PUSH_TOKEN: ${{ secrets.PACKAGING_PUSH_TOKEN }}
      # The sync script reads THIS repository's release through the API to
      # verify the digests before publishing them. That read must be
      # authenticated: an anonymous request shares the 60 req/hour budget of
      # the runner's IP, and GitHub's shared runner IPs exhaust it — the read
      # answers 403 and the script refuses to push anything unverified, so
      # the release goes out while the tap keeps serving the old version.
      # (Seen for real on v2.26.0.) This job only needs `contents: read`.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The manifests live on master, not on the tag: fill-sha256 pushes
          # the filled digests back to master, and that is the state the tap
          # must receive.
          ref: master

      - name: Guard the manifests before publishing them
        run: ./scripts/check-packaging-manifests.sh

      - name: Sync the Homebrew tap
        if: env.PACKAGING_PUSH_TOKEN != ''
        run: ./scripts/sync-packaging.sh homebrew --push

      - name: Sync the Scoop bucket
        if: env.PACKAGING_PUSH_TOKEN != ''
        run: ./scripts/sync-packaging.sh scoop --push

      - name: Report that the sync was skipped
        if: env.PACKAGING_PUSH_TOKEN == ''
        run: |
          echo "::notice::PACKAGING_PUSH_TOKEN is not set — the tap and the bucket were NOT updated."
          echo "::notice::Run scripts/sync-packaging.sh <homebrew|scoop> --push with a token that"
          echo "::notice::has write access to sky-jiangcheng/homebrew-repo and sky-jiangcheng/scoop-repo."

  # Publish the extension to the VS Code Marketplace with the same version
  # number as the product release. Requires the VSCE_PAT secret (a Personal
  # Access Token with Marketplace > Manage scope from the sky-jiangcheng
  # publisher's Azure DevOps account). Without the secret this job skips
  # with a warning and the release still ships — the vsix is on the release
  # either way, so users can install manually.
  publish-marketplace:
    name: Publish to VS Code Marketplace
    needs: create-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: ide/vscode/package-lock.json

      - name: Publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF#refs/tags/v}"
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT secret is not set — skipping Marketplace publish. The vsix is still attached to this release for manual install."
            exit 0
          fi
          cd ide/vscode
          npm ci
          npm run compile
          # No version argument. `vsce publish <v>` REWRITES package.json and
          # publishes the passed value, which is how the Marketplace ended up on the
          # app version while the manifest said something else. Publishing the
          # version that is already in ide/vscode/package.json keeps the attached
          # VSIX, the Marketplace listing and the manifest to a single number — the
          # file is stamped by scripts/bump-version.sh at release time.
          npx @vscode/vsce publish --no-dependencies
          echo "Published cinder-vscode@$(node -p "require('./package.json').version") to the VS Code Marketplace."

  # Publish the JetBrains plugin to the Marketplace with the same version as
  # the product release (build.gradle.kts follows wails.json via
  # scripts/bump-version.sh). Requires a permanent Marketplace token from the
  # vendor account (https://plugins.jetbrains.com/author/me/tokens). The three
  # signing secrets are optional: without them the upload is unsigned, which
  # Marketplace accepts — the signature only carries the verified-vendor badge.
  # Without the token this job skips with a warning and the zip stays on the
  # GitHub Release for manual install, mirroring publish-marketplace above.
  publish-jetbrains-marketplace:
    name: Publish to JetBrains Marketplace
    needs: create-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.10.2'

      - name: Publish plugin
        working-directory: ide/jetbrains
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${JETBRAINS_MARKETPLACE_TOKEN:-}" ]; then
            echo "::warning::JETBRAINS_MARKETPLACE_TOKEN is not set — skipping JetBrains Marketplace publish. The plugin zip is still attached to this release for manual install."
            exit 0
          fi
          if [ -z "${CERTIFICATE_CHAIN:-}" ] || [ -z "${PRIVATE_KEY:-}" ] || [ -z "${PRIVATE_KEY_PASSWORD:-}" ]; then
            echo "::notice::Signing secrets not set — publishing unsigned (Marketplace accepts this)."
            unset CERTIFICATE_CHAIN PRIVATE_KEY PRIVATE_KEY_PASSWORD
          fi
          UPLOAD_START="$(date +%s)"
          gradle publishPlugin --console=plain

          # What "published" means, checked instead of claimed.
          #
          # `publishPlugin` succeeding means the upload was ACCEPTED — not that
          # the version is listed. JetBrains moderates new versions, and a
          # version awaiting approval does not appear in the public update
          # list at all. The old unconditional echo said "Published" either
          # way, so the log for a version stuck in the review queue looked
          # exactly like the log for one that was listed within seconds
          # (2.16.0 vs 2.15.0: same lines, opposite outcomes).
          #
          # Three states, three sentences:
          #   - the version is in the public update list  -> listed, installable
          #   - the plugin record carries an update that is waiting for review
          #     AND the record was touched by THIS upload (an upload refreshes
          #     the record's cdate) -> uploaded, waiting for JetBrains, not
          #     installable yet; the zip on the GitHub Release is the artifact
          #     to hand out meanwhile
          #   - neither                                  -> the upload did not
          #     land, which is worth knowing before anyone says "it's out"
          #
          # A warning, never a failure: the marketplace's review queue is not
          # this repo's to control, and the release itself is already out.
          VER="${GITHUB_REF_NAME#v}"
          PLUGIN_ID=35396
          UPDATES="$(curl -sS --max-time 30 "https://plugins.jetbrains.com/api/plugins/${PLUGIN_ID}/updates?size=50" || echo '[]')"
          INFO="$(curl -sS --max-time 30 "https://plugins.jetbrains.com/api/plugins/${PLUGIN_ID}" || echo '{}')"
          if printf '%s' "$UPDATES" | jq -e --arg v "$VER" '.[] | select(.version == $v)' >/dev/null 2>&1; then
            echo "JetBrains Marketplace: ${VER} is listed and installable."
          elif jq -e '.hasUnapprovedUpdate == true' >/dev/null 2>&1 <<<"$INFO" \
               && [ "$(jq -r '.cdate // 0' <<<"$INFO")" -ge "$(( (UPLOAD_START - 300) * 1000 ))" ]; then
            echo "::notice::JetBrains Marketplace: ${VER} was uploaded but is PENDING APPROVAL — it is not installable from the marketplace yet. The zip on the GitHub Release is the installable artifact until JetBrains reviews it."
          else
            echo "::warning::JetBrains Marketplace: ${VER} does not appear after publishPlugin — the upload may not have landed. The zip on the GitHub Release is still the installable artifact."
          fi

  # After the release is published, the sha256 of every shipped asset is a
  # known fact. Homebrew and Scoop hard-fail on a missing/wrong digest, so the
  # manifests ship with `__FILL_SHA256_*__` placeholders (or a stale digest from
  # the previous release) and get stamped here. This job reads the per-asset
  # digest the GitHub Release API reports for the tag (one call replaces
  # downloading every asset just to hash it locally), writes
  # assets/releases/v<ver>/SHA256SUMS, runs scripts/update-manifests.sh
  # --fill-sha256, verifies no placeholder survived, and commits the packaging/
  # changes back to master so the downstream tap/bucket can pick them up.
  fill-sha256:
    name: Fill manifest sha256
    needs: create-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Check out the default branch, not the tag, so the manifest commit
          # can be pushed back. REPO_PUSH_TOKEN (PAT) lets the push itself
          # trigger downstream workflows; GITHUB_TOKEN is the fallback.
          token: ${{ secrets.REPO_PUSH_TOKEN || github.token }}
          ref: master

      - name: Compute version from tag
        id: ver
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Read published digests from the Release API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          DIR="assets/releases/v$VER"
          mkdir -p "$DIR"
          # The Release API reports a sha256 digest per uploaded asset; one call
          # replaces downloading every asset just to hash it locally. Assets
          # without a digest are simply absent from SHA256SUMS, which makes
          # --fill-sha256 skip the manifests that reference them - a partial
          # release leaves placeholders instead of writing wrong hashes. The
          # repo slug is the canonical one (no redirect dependence).
          python3 - "$VER" "$DIR/SHA256SUMS" <<'PY'
          import json, os, sys, urllib.request
          ver, out = sys.argv[1], sys.argv[2]
          url = f"https://api.github.com/repos/sky-jiangcheng/cinder/releases/tags/v{ver}"
          headers = {"Accept": "application/vnd.github+json"}
          # Authenticate when a token is available: shared runner IPs exhaust
          # the anonymous 60 req/hour limit and make this step flaky.
          token = os.environ.get("GITHUB_TOKEN", "")
          if token:
              headers["Authorization"] = f"Bearer {token}"
          rel = json.load(urllib.request.urlopen(urllib.request.Request(url, headers=headers)))
          with open(out, "w") as fh:
              for asset in rel.get("assets", []):
                  name = asset.get("name", "")
                  digest = asset.get("digest", "")
                  if name == "SHA256SUMS" or not digest.startswith("sha256:"):
                      continue
                  fh.write(f"{digest[7:]}  assets/releases/v{ver}/{name}\n")
          PY
          cat "$DIR/SHA256SUMS"

      - name: Fill sha256 in packaging manifests
        run: ./scripts/update-manifests.sh --fill-sha256

      - name: Verify every manifest digest belongs to this release
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          SUMS="assets/releases/v$VER/SHA256SUMS"
          # Gate 1: no placeholder may survive in the MANIFESTS. brew/scoop
          # hard-fail on them. The grep is scoped to the manifest FILES only:
          # an unscoped grep over packaging/ also matched the README, which
          # documents the placeholder format verbatim, so this gate failed on
          # its own docs and blocked every release fill since it was added
          # (v1.13.0, v1.14.0, v1.14.1). The file filter is also what makes
          # this namespace-agnostic: every packaging/<project>/… manifest is
          # covered, and a new project needs no change here.
          if grep -rn "__FILL_SHA256_" --include='*.rb' --include='*.json' packaging/; then
            echo "ERROR: at least one asset this release should ship is missing" >&2
            echo "       (its manifest kept the placeholder). Check the release page." >&2
            exit 1
          fi
          # Gate 2: freshness. A normal bump leaves the PREVIOUS release's
          # digests in place; if --fill-sha256 skipped an asset that exists in
          # no manifest line it touched, a stale digest would silently ship
          # and break every install. Every 64-hex digest in the manifests must
          # appear in THIS release's SHA256SUMS.
          bad=0
          for d in $(grep -rhoE '[a-f0-9]{64}' --include='*.rb' --include='*.json' packaging/ | sort -u); do
            if ! grep -q "$d" "$SUMS"; then
              echo "STALE digest in packaging/: $d"
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "ERROR: packaging/ carries digests that do not match release v$VER." >&2
            exit 1
          fi
          echo "all packaging/ digests match release v$VER"

      - name: Commit and push manifests
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaging/
          if git diff --cached --quiet; then
            echo "no manifest changes (all digests current)"
            exit 0
          fi
          git commit -m "chore(packaging): fill sha256 for v${{ steps.ver.outputs.version }}" \
                     -m "Automated by release.yml fill-sha256 job."
          git push origin HEAD:master
          echo "pushed packaging/ manifest updates to master"