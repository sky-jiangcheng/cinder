name: Verify push secrets (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Report secret presence
        env:
          REPO_PUSH_TOKEN: ${{ secrets.REPO_PUSH_TOKEN }}
          PACKAGING_PUSH_TOKEN: ${{ secrets.PACKAGING_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$REPO_PUSH_TOKEN" ] && echo "REPO_PUSH_TOKEN: present (${#REPO_PUSH_TOKEN} chars)" || echo "REPO_PUSH_TOKEN: MISSING"
          [ -n "$PACKAGING_PUSH_TOKEN" ] && echo "PACKAGING_PUSH_TOKEN: present (${#PACKAGING_PUSH_TOKEN} chars)" || echo "PACKAGING_PUSH_TOKEN: MISSING"

      - name: Check PAT can push to the tap and the bucket
        env:
          PACKAGING_PUSH_TOKEN: ${{ secrets.PACKAGING_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          for repo in sky-jiangcheng/homebrew-repo sky-jiangcheng/scoop-repo; do
            if git ls-remote "https://x-access-token:${PACKAGING_PUSH_TOKEN}@github.com/${repo}.git" HEAD >/dev/null 2>&1; then
              echo "${repo}: reachable with PACKAGING_PUSH_TOKEN"
            else
              echo "${repo}: NOT reachable"
            fi
          done
