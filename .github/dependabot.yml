# Dependabot configuration — monthly dependency updates, grouped per ecosystem
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
#
# Grouping matters more than cadence here: with 10 open PRs per ecosystem the
# dependency feed drowned the real issues (13 of 14 open issues were bumps).
# One grouped PR per ecosystem per month keeps updates flowing while leaving
# the issue list readable.

version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    groups:
      go-deps:
        patterns:
          - "*"

  # npm (frontend)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    # Two dependencies are handled on purpose, each for its own reason.
    #
    # A grouped PR that mixes a major bump with a dozen patch bumps is
    # unmergeable the moment the major turns out to be incompatible — and
    # the incompatibility surfaces as a red CI on the WHOLE group, which
    # reads like "the repo is broken" when in fact one package moved.
    #
    #   typescript  the compiler is a toolchain migration, not a dependency
    #               update. typescript-eslint's peer range (>=4.8.4 <6.1.0)
    #               does not admit TypeScript 7 yet, so `npm ci` fails to
    #               resolve at all — the install never reaches the tests.
    #               A major here is not merely unwanted, it is UNINSTALLABLE,
    #               so it is ignored outright until the peer range opens.
    #   jsdom       a major of jsdom pulls a newer undici, whose engines
    #               floor is node >= 22.19.0. It used to sit above the node
    #               20 that CI ran — and then every test file died loading
    #               (undici/lib/interceptor/decompress.js calls
    #               createZstdDecompress.bind(...) on a function node 20 does
    #               not have). CI now runs the node 24 that .nvmrc pins, so
    #               jsdom majors are installable again — they are excluded
    #               from the GROUP so they arrive as their own PR, which is
    #               where a reviewer can look at them.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      web-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "jsdom"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions-deps:
        patterns:
          - "*"
