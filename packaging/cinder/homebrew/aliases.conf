# 别名清单：改名之前被人存进终端的命令，改名之后还得能跑。
#
# 格式：<源文件（相对本项目的 homebrew/）>|<目标路径（相对 tap）>|<sed 表达式>
#
# 源文件是「当前」的那份清单，脚本复制它、只改 token —— 摘要、URL、app 名
# 一律与当前版本一致。指向旧版本的别名比没有别名更糟：它静默失败，而
# 「装上了、结果差了六个版本」比「没有这个 cask」贵得多。
#
# sed 表达式用 # 作分隔符（字段分隔符是 |），因为表达式的分隔符不能与
# 字段分隔符撞车 —— 一旦撞上，字段就会被切开，且不会报错。
Casks/repotory.rb|Casks/reponest.rb|s#^cask "repotory" do$#cask "reponest" do#
Casks/repotory-mcp.rb|Casks/reponest-mcp.rb|s#^cask "repotory-mcp" do$#cask "reponest-mcp" do#
Formula/repotory-mcp.rb|Formula/reponest-mcp.rb|s#^class RepotoryMcp < Formula$#class ReponestMcp < Formula#
